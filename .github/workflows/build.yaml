name: Build obs-neutral-balance

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # OBS release to build libobs against. Bump when you target a newer OBS.
  OBS_TAG: "31.1.1"
  # obs-deps release matching the OBS version (see obs-plugintemplate buildspec.json)
  DEPS_VERSION: "2025-07-11"

jobs:
  # -------------------------------------------------------------------------
  windows:
    name: Build for Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Download pre-built OBS dependencies
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_VERSION }}/windows-deps-${{ env.DEPS_VERSION }}-x64.zip" -OutFile deps.zip
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_VERSION }}/windows-deps-qt6-${{ env.DEPS_VERSION }}-x64.zip" -OutFile qt6.zip
          # Use tar.exe instead of Expand-Archive: PowerShell's Expand-Archive
          # chokes on archive entries with backslash-style directory paths.
          New-Item -ItemType Directory -Force deps | Out-Null
          tar -xf deps.zip -C deps
          tar -xf qt6.zip -C deps

      - name: Build and install libobs (OBS ${{ env.OBS_TAG }})
        shell: pwsh
        run: |
          git clone --depth 1 --branch ${{ env.OBS_TAG }} https://github.com/obsproject/obs-studio obs-studio
          # Shallow clones don't include submodules; obs-studio's configure checks
          # for obs-browser/obs-websocket even when they're disabled.
          git -C obs-studio submodule update --init --recursive --depth 1
          # The deps archives may extract flat or under a single top-level
          # folder; list the common candidates so either layout resolves.
          cmake -S obs-studio -B obs-studio/build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps;${{ github.workspace }}/deps/win-x64;${{ github.workspace }}/deps/x64;${{ github.workspace }}/deps/windows-x64" `
            -DENABLE_UI=OFF -DENABLE_SCRIPTING=OFF -DBUILD_TESTS=OFF `
            -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF
          # OBS's multi-arch layout puts the companion x86 pass in build_x86
          # and the native x64 libobs in build (obs-studio/build_x64 in some
          # configs) - pick whichever actually contains the project.
          $archDir = "obs-studio/build"
          if (Test-Path "obs-studio/build_x64/libobs.vcxproj") { $archDir = "obs-studio/build_x64" }
          cmake --build $archDir --config RelWithDebInfo --target libobs
          cmake --install $archDir --prefix "${{ github.workspace }}/libobs-prefix" `
            --config RelWithDebInfo --component libobs

      - name: Ensure libobs CMake package config
        shell: pwsh
        run: |
          $prefix = "${{ github.workspace }}/libobs-prefix"
          $srcRoot = "${{ github.workspace }}/obs-studio"
          $cfg = Get-ChildItem -Path $prefix -Recurse -Filter libobsConfig.cmake -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cfg) {
            Write-Host "Using libobs config: $($cfg.FullName)"
          } else {
            # Headers: prefer the install prefix, fall back to the source tree
            $hdr = Get-ChildItem -Path $prefix -Recurse -Filter obs-module.h -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hdr) { $incDir = $hdr.DirectoryName } else { $incDir = "$srcRoot/libobs" }
            $incList = $incDir.Replace('\', '/')
            $buildInc = "$srcRoot/build/libobs"
            if (Test-Path $buildInc) { $incList = "$incList;$($buildInc.Replace('\', '/'))" }
            # Import library: prefer the install prefix, fall back to the build tree
            $implibPath = $null
            $implib = Get-ChildItem -Path $prefix -Recurse -Filter obs.lib -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($implib) {
              $implibPath = $implib.FullName
            } else {
              foreach ($c in @("$srcRoot/build/libobs/RelWithDebInfo/obs.lib", "$srcRoot/build_x64/libobs/RelWithDebInfo/obs.lib", "$srcRoot/build/libobs/obs.lib")) {
                if (Test-Path $c) { $implibPath = $c; break }
              }
              if (-not $implibPath) {
                $found = Get-ChildItem -Path "$srcRoot/build", "$srcRoot/build_x64" -Recurse -Filter obs.lib -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'x86' } | Select-Object -First 1
                if ($found) { $implibPath = $found.FullName }
              }
            }
            if (-not (Test-Path $incDir) -or -not $implibPath) {
              Write-Error "Could not locate libobs headers or obs.lib under $prefix or $srcRoot"
              exit 1
            }
            $dir = "$prefix/lib/cmake/libobs"
            New-Item -ItemType Directory -Force $dir | Out-Null
            $cfgPath = Join-Path $dir 'libobsConfig.cmake'
            $c = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
            $c = $c.Replace('__NB_INCLUDE_DIR__', $incList).Replace('__NB_IMPLIB__', $implibPath.Replace('\', '/')).Replace('__NB_LIBPATH__', $implibPath.Replace('\', '/'))
            [IO.File]::WriteAllText($cfgPath, $c)
            Write-Host "Synthesized libobs config at $cfgPath (includes: $incList, implib: $implibPath)"
          }


      - name: Build plugin
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/libobs-prefix;${{ github.workspace }}/deps;${{ github.workspace }}/deps/win-x64;${{ github.workspace }}/deps/x64" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --config RelWithDebInfo

      - name: Package
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}/dist/obs-neutral-balance"
          New-Item -ItemType Directory -Force "$dist/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$dist/data/obs-plugins/obs-neutral-balance" | Out-Null
          Copy-Item "build/RelWithDebInfo/obs-neutral-balance.dll" "$dist/obs-plugins/64bit/"
          Copy-Item -Recurse "data/*" "$dist/data/obs-plugins/obs-neutral-balance/"
          Compress-Archive -Path "${{ github.workspace }}/dist/*" -DestinationPath "${{ github.workspace }}/obs-neutral-balance-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: obs-neutral-balance-windows-x64
          path: ${{ github.workspace }}/obs-neutral-balance-windows-x64.zip

  # -------------------------------------------------------------------------
  macos:
    name: Build for macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6
        run: brew install --quiet qt@6

      - name: Download pre-built OBS dependencies
        run: |
          curl -fSL -o deps.tar.gz "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_VERSION }}/macos-deps-${{ env.DEPS_VERSION }}-universal.tar.gz"
          curl -fSL -o qt6.tar.gz "https://github.com/obsproject/obs-deps/releases/download/${{ env.DEPS_VERSION }}/macos-deps-qt6-${{ env.DEPS_VERSION }}-universal.tar.gz"
          mkdir -p deps && tar -xzf deps.tar.gz -C deps && tar -xzf qt6.tar.gz -C deps

      - name: Build and install libobs (OBS ${{ env.OBS_TAG }})
        run: |
          git clone --depth 1 --branch ${{ env.OBS_TAG }} https://github.com/obsproject/obs-studio obs-studio
          # Shallow clones don't include submodules; obs-studio's configure checks
          # for obs-browser/obs-websocket even when they're disabled.
          git -C obs-studio submodule update --init --recursive --depth 1
          cmake -S obs-studio -B obs-studio/build -G "Xcode" \
            "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps;${{ github.workspace }}/deps/macos;${{ github.workspace }}/deps/universal;${{ github.workspace }}/deps/macos-arm64" \
            -DENABLE_UI=OFF -DENABLE_SCRIPTING=OFF -DBUILD_TESTS=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF
          cmake --build obs-studio/build --config RelWithDebInfo --target libobs
          cmake --install obs-studio/build --prefix "${{ github.workspace }}/libobs-prefix" \
            --config RelWithDebInfo --component libobs

      - name: Ensure libobs CMake package config
        run: |
          if find libobs-prefix -name libobsConfig.cmake | grep -q .; then
            echo "libobs config present"
            exit 0
          fi
          hdr=$(find libobs-prefix -name obs-module.h | head -1)
          if [ -n "$hdr" ]; then inc_dir=$(dirname "$hdr"); else inc_dir="obs-studio/libobs"; fi
          inc_list="$inc_dir"
          [ -d obs-studio/build/libobs ] && inc_list="$inc_list;obs-studio/build/libobs"
          lib=$(find libobs-prefix \( -name 'libobs.so' -o -name 'libobs.dylib' \) | head -1)
          [ -z "$lib" ] && lib=$(find libobs-prefix -path '*.framework/libobs' | head -1)
          if [ -z "$lib" ]; then
            lib=$(find obs-studio/build obs-studio/build_x64 \( -name 'libobs.so' -o -name 'libobs.dylib' -o -name 'obs.lib' \) 2>/dev/null | grep -v x86 | head -1)
          fi
          if [ ! -d "$inc_dir" ] || [ -z "$lib" ]; then
            echo "Could not locate libobs headers or library under libobs-prefix or obs-studio"
            exit 1
          fi
          mkdir -p libobs-prefix/lib/cmake/libobs
          cfg=libobs-prefix/lib/cmake/libobs/libobsConfig.cmake
          echo '' | base64 -d > "$cfg"
          sed -i "s|__NB_INCLUDE_DIR__|$inc_list|g; s|__NB_IMPLIB__|$lib|g; s|__NB_LIBPATH__|$lib|g" "$cfg"
          echo "synthesized libobs config (includes: $inc_list, lib: $lib)"


      - name: Build plugin
        run: |
          cmake -S . -B build -G "Xcode" \
            "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/libobs-prefix;${{ github.workspace }}/deps;${{ github.workspace }}/deps/macos;${{ github.workspace }}/deps/universal;$(brew --prefix qt@6)" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --config RelWithDebInfo

      - name: Package
        run: |
          dist="${{ github.workspace }}/dist/obs-neutral-balance"
          mkdir -p "$dist/obs-plugins" "$dist/data/obs-plugins/obs-neutral-balance"
          cp "build/RelWithDebInfo/obs-neutral-balance.dylib" "$dist/obs-plugins/"
          cp -R data/* "$dist/data/obs-plugins/obs-neutral-balance/"
          cd "${{ github.workspace }}/dist" && zip -r ../obs-neutral-balance-macos-arm64.zip obs-neutral-balance

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: obs-neutral-balance-macos-arm64
          path: ${{ github.workspace }}/obs-neutral-balance-macos-arm64.zip

  # -------------------------------------------------------------------------
  linux:
    name: Build for Ubuntu x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # extra-cmake-modules + FFmpeg dev libs are REQUIRED by OBS 31's
          # Linux CMake configure (libobs hard-requires FFmpeg >= 6.1).
          sudo apt-get install -y --no-install-recommends \
            build-essential git cmake ninja-build pkg-config \
            extra-cmake-modules \
            uthash-dev libjansson-dev \
            libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev libxfixes-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libudev-dev \
            qt6-base-dev

      - name: Build and install libobs (OBS ${{ env.OBS_TAG }})
        run: |
          git clone --depth 1 --branch ${{ env.OBS_TAG }} https://github.com/obsproject/obs-studio obs-studio
          # Shallow clones don't include submodules; obs-studio's configure checks
          # for obs-browser/obs-websocket even when they're disabled.
          git -C obs-studio submodule update --init --recursive --depth 1
          cmake -S obs-studio -B obs-studio/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_UI=OFF -DENABLE_SCRIPTING=OFF -DBUILD_TESTS=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF
          cmake --build obs-studio/build --target libobs
          cmake --install obs-studio/build --prefix "${{ github.workspace }}/libobs-prefix" --component libobs

      - name: Ensure libobs CMake package config
        run: |
          if find libobs-prefix -name libobsConfig.cmake | grep -q .; then
            echo "libobs config present"
            exit 0
          fi
          hdr=$(find libobs-prefix -name obs-module.h | head -1)
          if [ -n "$hdr" ]; then inc_dir=$(dirname "$hdr"); else inc_dir="obs-studio/libobs"; fi
          inc_list="$inc_dir"
          [ -d obs-studio/build/libobs ] && inc_list="$inc_list;obs-studio/build/libobs"
          lib=$(find libobs-prefix \( -name 'libobs.so' -o -name 'libobs.dylib' \) | head -1)
          [ -z "$lib" ] && lib=$(find libobs-prefix -path '*.framework/libobs' | head -1)
          if [ -z "$lib" ]; then
            lib=$(find obs-studio/build obs-studio/build_x64 \( -name 'libobs.so' -o -name 'libobs.dylib' -o -name 'obs.lib' \) 2>/dev/null | grep -v x86 | head -1)
          fi
          if [ ! -d "$inc_dir" ] || [ -z "$lib" ]; then
            echo "Could not locate libobs headers or library under libobs-prefix or obs-studio"
            exit 1
          fi
          mkdir -p libobs-prefix/lib/cmake/libobs
          cfg=libobs-prefix/lib/cmake/libobs/libobsConfig.cmake
          echo '' | base64 -d > "$cfg"
          sed -i "s|__NB_INCLUDE_DIR__|$inc_list|g; s|__NB_IMPLIB__|$lib|g; s|__NB_LIBPATH__|$lib|g" "$cfg"
          echo "synthesized libobs config (includes: $inc_list, lib: $lib)"


      - name: Build plugin
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/libobs-prefix" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

      - name: Package
        run: |
          dist="${{ github.workspace }}/dist/obs-neutral-balance"
          mkdir -p "$dist/obs-plugins" "$dist/data/obs-plugins/obs-neutral-balance"
          cp "build/obs-neutral-balance.so" "$dist/obs-plugins/"
          cp -R data/* "$dist/data/obs-plugins/obs-neutral-balance/"
          cd "${{ github.workspace }}/dist" && zip -r ../obs-neutral-balance-ubuntu-x86_64.zip obs-neutral-balance

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: obs-neutral-balance-ubuntu-x86_64
          path: ${{ github.workspace }}/obs-neutral-balance-ubuntu-x86_64.zip
